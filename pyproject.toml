[project]
name = "lewm"
version = "0.1.0"
description = "From-scratch PyTorch reimplementation of LeWorldModel (LeWM) on PushT"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.7",
    "numpy",
    "h5py",
    "hdf5plugin",
    "pyyaml",
    "matplotlib",
    "huggingface_hub",
    "wandb>=0.31.2",
    "stable-worldmodel>=0.1.1",
    "torchvision>=0.26.0",
    "opencv-python-headless>=5.1.0.95",
    "pygame>=2.6.1",
    "pymunk>=7.3.1",
    "shapely>=2.2.0",
    "imageio>=2.38.2",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lewm"]

# CUDA-enabled PyTorch wheels (Blackwell sm_120 needs CUDA >= 12.8 builds).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
