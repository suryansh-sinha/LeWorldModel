# Full LeWM run on PushT. Fixed settings (CLAUDE.md): epochs 10, batch 128, lam 0.1.
h5_path: data/pusht_expert_train.h5
stride: 5             # decision 9 (owner, 2026-11-24); stride 1 would be ~8.7 h
epochs: 10
batch_size: 128
lam: 0.1
lr: 5.0e-5
weight_decay: 1.0e-3
grad_clip: 1.0
warmup_frac: 0.05
num_workers: 12
seed: 0
val_batches: 20
keep_epoch_ckpts: true
out_dir: outputs/runs/pusht
wandb: {project: lewm, mode: online}
