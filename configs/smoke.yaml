# Smoke run: overfit a fixed 1024-window train subset (8 steps/epoch, 400 steps).
h5_path: data/pusht_expert_train.h5
stride: 5
subset: 1024
epochs: 50
batch_size: 128
lam: 0.1
lr: 5.0e-5
weight_decay: 1.0e-3
grad_clip: 1.0
warmup_frac: 0.05
num_workers: 12
seed: 0
val_batches: 2
keep_epoch_ckpts: false
out_dir: outputs/runs/smoke
wandb: {project: lewm, mode: online}
